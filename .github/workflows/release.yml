name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.14"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create or update release with auto-generated notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Tethera ${{ steps.tag.outputs.value }}
          draft: true
          prerelease: ${{ contains(steps.tag.outputs.value, '-') }}
          generate_release_notes: true

  build:
    name: Build (${{ matrix.os }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            dist_script: dist:mac
            artifact_glob: |
              apps/desktop/dist/*.dmg
              apps/desktop/dist/*.zip
          - os: windows-latest
            platform: win
            dist_script: dist:win
            artifact_glob: |
              apps/desktop/dist/*.exe
              apps/desktop/dist/*.zip
          - os: ubuntu-latest
            platform: linux
            dist_script: dist:linux
            artifact_glob: |
              apps/desktop/dist/*.AppImage
              apps/desktop/dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build sync-engine (release)
        run: cargo build --release -p sync-engine

      - name: Stage engine binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p apps/desktop/resources/engine
          cp target/release/sync-engine apps/desktop/resources/engine/sync-engine
          chmod +x apps/desktop/resources/engine/sync-engine

      - name: Stage engine binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/resources/engine | Out-Null
          Copy-Item target/release/sync-engine.exe apps/desktop/resources/engine/sync-engine.exe

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop app (${{ matrix.platform }})
        run: bun run --filter @tethera/desktop ${{ matrix.dist_script }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: true
          files: ${{ matrix.artifact_glob }}

  publish-release:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.create-release.outputs.tag }}" --draft=false --repo "${{ github.repository }}"
