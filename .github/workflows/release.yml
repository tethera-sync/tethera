name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (for example, v0.0.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.14"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  prepare-release:
    name: Validate version and create release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve and validate release version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="$PUSH_TAG"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must use semantic version format, such as v0.0.1."
            exit 1
          fi

          version="${tag#v}"
          desktop_version="$(python3 -c 'import json; print(json.load(open("apps/desktop/package.json"))["version"])')"
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          lock_version="$(python3 -c 'import re,sys; text=open("bun.lock").read(); m=re.search(r"\"apps/desktop\"\s*:\s*\{.*?\"version\"\s*:\s*\"([^\"]+)\"", text, re.DOTALL); sys.exit("Could not find apps/desktop version in bun.lock") if m is None else print(m.group(1))')"

          if [[ "$desktop_version" != "$version" || "$cargo_version" != "$version" || "$lock_version" != "$version" ]]; then
            echo "::error::Version mismatch: tag=$version desktop=$desktop_version cargo=$cargo_version bun-lock=$lock_version"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Tethera ${{ steps.release.outputs.tag }}
          draft: true
          prerelease: ${{ contains(steps.release.outputs.tag, '-') }}
          generate_release_notes: true

  build:
    name: Build (${{ matrix.os }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            dist_script: dist:mac
            artifact_glob: |
              apps/desktop/dist/*.dmg
          - os: windows-latest
            platform: win
            dist_script: dist:win
            artifact_glob: |
              apps/desktop/dist/*.exe
          - os: ubuntu-latest
            platform: linux
            dist_script: dist:linux
            artifact_glob: |
              apps/desktop/dist/*.AppImage
              apps/desktop/dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build sync-engine (release)
        run: cargo build --release -p sync-engine

      - name: Stage engine binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p apps/desktop/resources/engine
          cp target/release/sync-engine apps/desktop/resources/engine/sync-engine
          chmod +x apps/desktop/resources/engine/sync-engine

      - name: Stage engine binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/resources/engine | Out-Null
          Copy-Item target/release/sync-engine.exe apps/desktop/resources/engine/sync-engine.exe

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop app (${{ matrix.platform }})
        run: bun run --filter @tethera/desktop ${{ matrix.dist_script }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          draft: true
          files: ${{ matrix.artifact_glob }}

  publish-release:
    name: Publish release
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.prepare-release.outputs.tag }}" --draft=false --repo "${{ github.repository }}"
